<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bosa‑Care · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --purple-950:#1c1430; --purple-900:#2d1b4e; --purple-700:#4c1d95; --purple-600:#6d28d9;
    --purple-500:#7c3aed; --purple-300:#a78bfa; --purple-200:#c4b5fd; --purple-100:#ede9fe; --purple-50:#f8f5ff;
    --bg:#f6f2fd; --surface:#ffffff; --ink:#201a2e; --ink-soft:#5b5270; --ink-faint:#978caa;
    --line:rgba(109,40,217,0.10); --line-strong:rgba(109,40,217,0.22);
    --good:#15803d; --danger:#b91c1c;
    --radius-sm:10px; --radius-lg:26px; --radius-pill:999px;
    --shadow-sm:0 2px 10px rgba(76,29,149,0.05); --shadow-lg:0 30px 65px -18px rgba(45,27,78,0.28);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 1.5rem;
    background-image:radial-gradient(ellipse 700px 500px at 12% 88%, rgba(124,58,237,0.10), transparent 50%),
                      radial-gradient(ellipse 600px 450px at 88% 10%, rgba(179,118,111,0.09), transparent 45%);
  }
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;}
  :focus-visible{outline:2.5px solid var(--purple-600);outline-offset:2px;border-radius:6px;}

  .brand-top{display:flex;align-items:center;gap:0.75rem;margin-bottom:2rem;}
  .brand-top .mark{width:46px;height:46px;background:linear-gradient(150deg,var(--purple-500),var(--purple-900));
    border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#fff;box-shadow:var(--shadow-sm);}
  .brand-top .name{font-family:'Playfair Display',serif;font-size:1.9rem;font-weight:700;color:var(--purple-900);letter-spacing:-0.02em;}
  .brand-top .name em{font-style:normal;color:var(--purple-600);}

  .login-card{max-width:480px;width:100%;background:rgba(255,255,255,0.94);backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:var(--radius-lg);padding:2.6rem 2.3rem;box-shadow:var(--shadow-lg);
    transition:border-color .3s;}
  .login-card:hover{border-color:var(--line-strong);}

  .welcome{text-align:center;margin-bottom:0.2rem;}
  .welcome h2{font-family:'Playfair Display',serif;font-size:1.85rem;font-weight:700;letter-spacing:-0.02em;color:var(--purple-950);}
  .welcome p{color:var(--ink-soft);font-size:0.95rem;margin-top:0.35rem;}

  .role-toggle{display:flex;background:var(--purple-50);border-radius:var(--radius-pill);padding:0.3rem;
    margin:1.9rem 0 1.6rem;border:1px solid var(--line);}
  .role-toggle button{flex:1;padding:0.72rem 0.5rem;border-radius:var(--radius-pill);background:transparent;
    color:var(--ink-soft);font-weight:600;font-size:0.95rem;transition:all .22s var(--ease);}
  .role-toggle button.active{background:linear-gradient(150deg,var(--purple-500),var(--purple-700));color:#fff;
    box-shadow:0 6px 18px rgba(109,40,217,0.32);}
  .role-toggle button:hover:not(.active){color:var(--purple-900);}

  .form-group{margin-bottom:1.25rem;}
  .form-group label{display:block;font-size:0.74rem;font-weight:700;color:var(--ink-soft);margin-bottom:0.4rem;
    letter-spacing:0.06em;text-transform:uppercase;}
  .form-group input{width:100%;padding:0.82rem 1.1rem;border-radius:var(--radius-sm);border:1.5px solid var(--line);
    background:var(--purple-50);color:var(--purple-950);font-size:1rem;font-family:'DM Sans',sans-serif;transition:all .18s;}
  .form-group input:focus{outline:none;border-color:var(--purple-500);box-shadow:0 0 0 4px rgba(124,58,237,0.10);background:#fff;}
  .form-group input::placeholder{color:var(--ink-faint);}

  .login-btn{width:100%;padding:0.95rem;border-radius:var(--radius-pill);font-size:1rem;font-weight:700;
    background:linear-gradient(150deg,var(--purple-500),var(--purple-700));border:none;color:#fff;
    transition:all .22s var(--ease);box-shadow:0 8px 22px rgba(109,40,217,0.32);letter-spacing:0.03em;margin-top:0.2rem;}
  .login-btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(109,40,217,0.4);}
  .login-btn:active{transform:translateY(0);}

  .demo-hint{text-align:center;font-size:0.8rem;color:var(--ink-soft);margin-top:1.6rem;padding-top:1.3rem;
    border-top:1px solid var(--line);line-height:2;}
  .demo-hint .lead{color:var(--purple-900);font-weight:700;margin-bottom:0.5rem;}
  .demo-hint .role-label{color:var(--purple-950);font-weight:600;}
  .demo-hint code{background:var(--purple-50);padding:0.18rem 0.7rem;border-radius:8px;font-size:0.75rem;
    color:var(--purple-600);font-family:'DM Sans',monospace;border:1px solid var(--line);}
  .demo-hint .sep{color:var(--ink-faint);margin:0 0.3rem;}
  .demo-hint .demo-row{display:flex;justify-content:center;gap:2rem;flex-wrap:wrap;}
  .demo-hint .demo-col{text-align:left;}

  #loginStatus{margin-top:1rem;padding:0.75rem 1rem;border-radius:var(--radius-sm);font-size:0.85rem;
    text-align:center;display:none;font-weight:500;}
  #loginStatus.success{display:block;background:rgba(21,128,61,0.08);border:1px solid rgba(21,128,61,0.18);color:var(--good);}
  #loginStatus.error{display:block;background:rgba(185,28,28,0.06);border:1px solid rgba(185,28,28,0.15);color:var(--danger);}

  .footer-note{margin-top:2rem;font-size:0.72rem;color:var(--ink-faint);text-align:center;letter-spacing:0.04em;}

  @media (max-width:500px){
    .login-card{padding:1.9rem 1.3rem;border-radius:20px;}
    .brand-top .name{font-size:1.5rem;}
    .welcome h2{font-size:1.4rem;}
    .role-toggle button{font-size:0.8rem;padding:0.55rem 0.3rem;}
    .demo-hint .demo-row{flex-direction:column;gap:0.5rem;align-items:center;}
    .demo-hint .demo-col{text-align:center;}
  }
</style>
</head>
<body>

  <div class="brand-top">
    <div class="mark">⚕</div>
    <span class="name">Bosa‑<em>Care</em></span>
  </div>

  <div class="login-card" id="loginCard">

    <div class="welcome">
      <h2>Welcome back</h2>
      <p>Sign in to manage your chronic care</p>
    </div>

    <div class="role-toggle" id="roleToggle">
      <button class="active" data-role="patient" onclick="setRole('patient')" type="button">👤 Patient</button>
      <button data-role="doctor" onclick="setRole('doctor')" type="button">👨‍⚕️ Doctor</button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="emailInput">Email address</label>
        <input type="email" id="emailInput" placeholder="you@example.com" value="john@bosa.care" autofocus />
      </div>
      <div class="form-group">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" value="patient123" />
      </div>

      <button type="submit" class="login-btn" id="loginBtn">Sign In as Patient</button>
    </form>

    <div id="loginStatus"></div>

    <div class="demo-hint">
      <div class="lead">🔑 Demo Credentials</div>
      <div class="demo-row">
        <div class="demo-col">
          <span class="role-label">👤 Patient</span><br />
          <code>john@bosa.care</code> <span class="sep">/</span> <code>patient123</code>
        </div>
        <div class="demo-col">
          <span class="role-label">👨‍⚕️ Doctor</span><br />
          <code>sarah@bosa.care</code> <span class="sep">/</span> <code>doctor123</code>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-note">Bosa‑Care · Chronic care management platform</div>

  <script>
    let currentRole = 'patient';

    const USERS = {
      patient: { email: 'john@bosa.care', password: 'patient123', name: 'John Matthews', dashboard: 'patient-dashboard.html' },
      doctor:  { email: 'sarah@bosa.care', password: 'doctor123', name: 'Dr. Sarah Achieng', dashboard: 'doctor-dashboard.html' }
    };

    function setRole(role) {
      currentRole = role;
      document.querySelectorAll('#roleToggle button').forEach(b => b.classList.remove('active'));
      document.querySelector(`#roleToggle button[data-role="${role}"]`).classList.add('active');

      document.getElementById('loginBtn').textContent = role === 'patient' ? 'Sign In as Patient' : 'Sign In as Doctor';

      const emailInput = document.getElementById('emailInput');
      const user = USERS[role];
      if (emailInput.value !== user.email) emailInput.value = user.email;
      document.getElementById('passwordInput').value = user.password;

      const status = document.getElementById('loginStatus');
      status.className = '';
      status.style.display = 'none';
      status.textContent = '';
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      if (!email || !password) return showStatus('Please fill in both email and password.', 'error');

      const user = USERS[currentRole];
      if (email === user.email && password === user.password) {
        localStorage.setItem('bosaUser', JSON.stringify({ name: user.name, email: user.email, role: currentRole }));
        localStorage.setItem('bosaRole', currentRole);
        showStatus(`✅ Welcome, ${user.name}! Redirecting…`, 'success');
        setTimeout(() => { window.location.href = user.dashboard; }, 1000);
        return;
      }

      if (currentRole === 'patient' && email === USERS.doctor.email && password === USERS.doctor.password)
        return showStatus('❌ This is a doctor account. Please switch to Doctor role.', 'error');
      if (currentRole === 'doctor' && email === USERS.patient.email && password === USERS.patient.password)
        return showStatus('❌ This is a patient account. Please switch to Patient role.', 'error');

      showStatus('❌ Invalid email or password. Please try again.', 'error');
    }

    function showStatus(message, type) {
      const status = document.getElementById('loginStatus');
      status.textContent = message;
      status.className = type;
      status.style.display = 'block';
    }

    document.getElementById('emailInput').addEventListener('input', function () {
      const val = this.value.trim().toLowerCase();
      if (val.includes('sarah') || val.includes('doctor')) setRole('doctor');
      else if (val.includes('john') || val.includes('patient')) setRole('patient');
    });

    document.addEventListener('DOMContentLoaded', () => {
      const emailInput = document.getElementById('emailInput');
      setRole(emailInput.value.includes('sarah') || emailInput.value.includes('doctor') ? 'doctor' : 'patient');
    });
  </script>

</body>
</html>
