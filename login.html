<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bosa‑Care · Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b132b;
            color: #e8edf5;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse at 15% 85%, rgba(29, 78, 216, 0.15) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 15%, rgba(56, 189, 248, 0.06) 0%, transparent 40%),
                linear-gradient(160deg, #060e20 0%, #0f172a 40%, #0b1f3a 100%);
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        /* Brand header */
        .brand-top {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .brand-top .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #1d4ed8, #0b1f3a);
            border-radius: 14px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .brand-top .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
        }
        .brand-top .brand-name span {
            color: #38bdf8;
        }

        /* Main card */
        .login-card {
            max-width: 480px;
            width: 100%;
            background: rgba(13, 24, 45, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(70, 130, 200, 0.2);
            border-radius: 32px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transition: border-color 0.3s;
        }
        .login-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .login-card .welcome {
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .login-card .welcome h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #fff;
        }
        .login-card .welcome p {
            color: #8aa9d9;
            font-size: 0.95rem;
            margin-top: 0.3rem;
        }

        /* Role toggle */
        .role-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 60px;
            padding: 0.3rem;
            margin: 1.8rem 0 1.5rem;
            border: 1px solid rgba(110, 168, 254, 0.12);
        }
        .role-toggle button {
            flex: 1;
            padding: 0.7rem 0.5rem;
            border-radius: 40px;
            background: transparent;
            color: #8aa9d9;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            letter-spacing: 0.02em;
        }
        .role-toggle button.active {
            background: linear-gradient(145deg, #1f4e8c, #2a62b0);
            color: white;
            box-shadow: 0 4px 16px rgba(30, 80, 180, 0.35);
        }
        .role-toggle button:hover:not(.active) {
            color: #c6dbfa;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #8aa9d9;
            margin-bottom: 0.35rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1.1rem;
            border-radius: 14px;
            border: 1px solid rgba(70, 130, 200, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #e8edf5;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4a8ad6;
            box-shadow: 0 0 0 3px rgba(74, 138, 214, 0.15);
            background: rgba(0, 0, 0, 0.45);
        }
        .form-group input::placeholder {
            color: #4d6f9a;
        }

        .login-btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(145deg, #1f4e8c, #2a62b0);
            border: 1px solid #3f7bc9;
            color: white;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(30, 80, 180, 0.3);
            letter-spacing: 0.04em;
            margin-top: 0.25rem;
        }
        .login-btn:hover {
            background: linear-gradient(145deg, #2a62b0, #1f4e8c);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 80, 180, 0.45);
        }
        .login-btn:active {
            transform: translateY(0);
        }

        /* Demo credentials */
        .demo-hint {
            text-align: center;
            font-size: 0.8rem;
            color: #4d6f9a;
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(70, 130, 200, 0.1);
            line-height: 2;
        }
        .demo-hint .role-label {
            color: #8aa9d9;
            font-weight: 600;
        }
        .demo-hint code {
            background: rgba(0, 0, 0, 0.35);
            padding: 0.15rem 0.7rem;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #8bb9ff;
            font-family: 'DM Sans', monospace;
            border: 1px solid rgba(110, 168, 254, 0.08);
        }
        .demo-hint .sep {
            color: #2f5080;
            margin: 0 0.3rem;
        }
        .demo-hint .demo-row {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .demo-hint .demo-col {
            text-align: left;
        }

        /* Status message */
        #loginStatus {
            margin-top: 1rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        #loginStatus.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #86efac;
        }
        #loginStatus.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Footer */
        .footer-note {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #2f5080;
            text-align: center;
            letter-spacing: 0.04em;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .login-card {
                padding: 1.8rem 1.2rem;
                border-radius: 24px;
            }
            .brand-top .brand-name {
                font-size: 1.5rem;
            }
            .login-card .welcome h2 {
                font-size: 1.4rem;
            }
            .role-toggle button {
                font-size: 0.8rem;
                padding: 0.5rem 0.3rem;
            }
            .demo-hint .demo-row {
                flex-direction: column;
                gap: 0.5rem;
                align-items: center;
            }
            .demo-hint .demo-col {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Brand -->
    <div class="brand-top">
        <div class="brand-icon">⚕</div>
        <span class="brand-name">Bosa‑<span>Care</span></span>
    </div>

    <!-- Login Card -->
    <div class="login-card" id="loginCard">

        <div class="welcome">
            <h2>Welcome back</h2>
            <p>Sign in to manage your chronic care</p>
        </div>

        <!-- Role Toggle -->
        <div class="role-toggle" id="roleToggle">
            <button class="active" data-role="patient" onclick="setRole('patient')">👤 Patient</button>
            <button data-role="doctor" onclick="setRole('doctor')">👨‍⚕️ Doctor</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="emailInput">Email address</label>
                <input type="email" id="emailInput" placeholder="you@example.com" value="john@bosa.care" autofocus />
            </div>
            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" value="patient123" />
            </div>

            <button type="submit" class="login-btn" id="loginBtn">Sign In as Patient</button>
        </form>

        <!-- Status message -->
        <div id="loginStatus"></div>

        <!-- Demo credentials -->
        <div class="demo-hint">
            <div style="color:#6a89b0; font-weight:600; margin-bottom:0.5rem;">🔑 Demo Credentials</div>
            <div class="demo-row">
                <div class="demo-col">
                    <span class="role-label">👤 Patient</span><br />
                    <code>john@bosa.care</code> <span class="sep">/</span> <code>patient123</code>
                </div>
                <div class="demo-col">
                    <span class="role-label">👨‍⚕️ Doctor</span><br />
                    <code>sarah@bosa.care</code> <span class="sep">/</span> <code>doctor123</code>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-note">Bosa‑Care · Chronic care management platform</div>

    <script>
        // ===== STATE =====
        let currentRole = 'patient';

        // ===== FAKE USER DATA =====
        const USERS = {
            patient: {
                email: 'john@bosa.care',
                password: 'patient123',
                name: 'John Matthews',
                dashboard: 'patient-dashboard.html'
            },
            doctor: {
                email: 'sarah@bosa.care',
                password: 'doctor123',
                name: 'Dr. Sarah Achieng',
                dashboard: 'doctor-dashboard.html'
            }
        };

        // ===== ROLE TOGGLE =====
        function setRole(role) {
            currentRole = role;
            const btns = document.querySelectorAll('#roleToggle button');
            btns.forEach(b => b.classList.remove('active'));
            document.querySelector(`#roleToggle button[data-role="${role}"]`).classList.add('active');

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.textContent = role === 'patient' ? 'Sign In as Patient' : 'Sign In as Doctor';

            // Update placeholder email based on role
            const emailInput = document.getElementById('emailInput');
            const user = USERS[role];
            if (emailInput.value !== user.email) {
                emailInput.value = user.email;
            }
            document.getElementById('passwordInput').value = user.password;

            // Clear any previous status
            const status = document.getElementById('loginStatus');
            status.className = '';
            status.style.display = 'none';
            status.textContent = '';
        }

        // ===== HANDLE LOGIN =====
        function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const status = document.getElementById('loginStatus');

            // Reset status
            status.className = '';
            status.style.display = 'none';
            status.textContent = '';

            // Validation
            if (!email || !password) {
                showStatus('Please fill in both email and password.', 'error');
                return;
            }

            // Get the user for the current role
            const user = USERS[currentRole];

            // Check credentials
            if (email === user.email && password === user.password) {
                // Store user info in localStorage for dashboard
                localStorage.setItem('bosaUser', JSON.stringify({
                    name: user.name,
                    email: user.email,
                    role: currentRole
                }));
                localStorage.setItem('bosaRole', currentRole);

                showStatus(`✅ Welcome, ${user.name}! Redirecting…`, 'success');

                setTimeout(() => {
                    window.location.href = user.dashboard;
                }, 1000);
                return;
            }

            // Check if they're using the wrong role
            if (currentRole === 'patient' && email === USERS.doctor.email && password === USERS.doctor.password) {
                showStatus('❌ This is a doctor account. Please switch to Doctor role.', 'error');
                return;
            }
            if (currentRole === 'doctor' && email === USERS.patient.email && password === USERS.patient.password) {
                showStatus('❌ This is a patient account. Please switch to Patient role.', 'error');
                return;
            }

            // Invalid credentials
            showStatus('❌ Invalid email or password. Please try again.', 'error');
        }

        function showStatus(message, type) {
            const status = document.getElementById('loginStatus');
            status.textContent = message;
            status.className = type;
            status.style.display = 'block';
        }

        // ===== AUTO-FILL AND DETECT ROLE =====
        document.getElementById('emailInput').addEventListener('input', function() {
            const val = this.value.trim().toLowerCase();
            if (val.includes('sarah') || val.includes('doctor')) {
                setRole('doctor');
            } else if (val.includes('john') || val.includes('patient')) {
                setRole('patient');
            }
        });

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            // Set initial role based on default email
            const emailInput = document.getElementById('emailInput');
            if (emailInput.value.includes('sarah') || emailInput.value.includes('doctor')) {
                setRole('doctor');
            } else {
                setRole('patient');
            }
        });
    </script>

</body>
</html>
