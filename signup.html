<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bosa‑Care · Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b132b;
            color: #e8edf5;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse at 15% 85%, rgba(29, 78, 216, 0.15) 0%, transparent 45%),
                radial-gradient(ellipse at 85% 15%, rgba(56, 189, 248, 0.06) 0%, transparent 40%),
                linear-gradient(160deg, #060e20 0%, #0f172a 40%, #0b1f3a 100%);
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        /* Brand header */
        .brand-top {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }
        .brand-top .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #1d4ed8, #0b1f3a);
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .brand-top .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.02em;
        }
        .brand-top .brand-name span {
            color: #38bdf8;
        }

        /* Main card */
        .signup-card {
            max-width: 500px;
            width: 100%;
            background: rgba(13, 24, 45, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(70, 130, 200, 0.2);
            border-radius: 32px;
            padding: 2.5rem 2.2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transition: border-color 0.3s;
        }
        .signup-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .signup-card .header {
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .signup-card .header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #fff;
        }
        .signup-card .header p {
            color: #8aa9d9;
            font-size: 0.95rem;
            margin-top: 0.3rem;
        }

        /* Role toggle */
        .role-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 60px;
            padding: 0.3rem;
            margin: 1.8rem 0 1.5rem;
            border: 1px solid rgba(110, 168, 254, 0.12);
        }
        .role-toggle button {
            flex: 1;
            padding: 0.65rem 0.5rem;
            border-radius: 40px;
            background: transparent;
            color: #8aa9d9;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            letter-spacing: 0.02em;
        }
        .role-toggle button.active {
            background: linear-gradient(145deg, #1f4e8c, #2a62b0);
            color: white;
            box-shadow: 0 4px 16px rgba(30, 80, 180, 0.35);
        }
        .role-toggle button:hover:not(.active) {
            color: #c6dbfa;
        }

        /* Form */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #8aa9d9;
            margin-bottom: 0.35rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem 1.1rem;
            border-radius: 14px;
            border: 1px solid rgba(70, 130, 200, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #e8edf5;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.2s;
            appearance: none;
        }
        .form-group select option {
            background: #0b132b;
            color: #e8edf5;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4a8ad6;
            box-shadow: 0 0 0 3px rgba(74, 138, 214, 0.15);
            background: rgba(0, 0, 0, 0.45);
        }
        .form-group input::placeholder {
            color: #4d6f9a;
        }

        .password-requirements {
            font-size: 0.7rem;
            color: #4d6f9a;
            margin-top: 0.3rem;
            line-height: 1.6;
        }
        .password-requirements .valid {
            color: #86efac;
        }
        .password-requirements .invalid {
            color: #fca5a5;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            font-size: 0.82rem;
            color: #6a89b0;
            margin: 0.2rem 0 1.2rem;
        }
        .terms input[type="checkbox"] {
            accent-color: #2a62b0;
            width: 18px;
            height: 18px;
            margin-top: 0.1rem;
            flex-shrink: 0;
            cursor: pointer;
        }
        .terms a {
            color: #6ea8fe;
            transition: 0.15s;
        }
        .terms a:hover {
            color: #8bb9ff;
            text-decoration: underline;
        }

        .signup-btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(145deg, #1f4e8c, #2a62b0);
            border: 1px solid #3f7bc9;
            color: white;
            transition: all 0.25s ease;
            box-shadow: 0 4px 14px rgba(30, 80, 180, 0.3);
            letter-spacing: 0.04em;
            margin-top: 0.25rem;
        }
        .signup-btn:hover {
            background: linear-gradient(145deg, #2a62b0, #1f4e8c);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 80, 180, 0.45);
        }
        .signup-btn:active {
            transform: translateY(0);
        }
        .signup-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #6a89b0;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(70, 130, 200, 0.1);
        }
        .login-link a {
            color: #6ea8fe;
            font-weight: 600;
            transition: 0.15s;
        }
        .login-link a:hover {
            color: #8bb9ff;
            text-decoration: underline;
        }

        /* Status message */
        #signupStatus {
            margin-top: 1rem;
            padding: 0.7rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        #signupStatus.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #86efac;
        }
        #signupStatus.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        /* Footer */
        .footer-note {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #2f5080;
            text-align: center;
            letter-spacing: 0.04em;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .signup-card {
                padding: 1.8rem 1.2rem;
                border-radius: 24px;
            }
            .brand-top .brand-name {
                font-size: 1.4rem;
            }
            .signup-card .header h2 {
                font-size: 1.4rem;
            }
            .role-toggle button {
                font-size: 0.8rem;
                padding: 0.5rem 0.3rem;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Brand -->
    <div class="brand-top">
        <div class="brand-icon">⚕</div>
        <span class="brand-name">Bosa‑<span>Care</span></span>
    </div>

    <!-- Signup Card -->
    <div class="signup-card" id="signupCard">

        <div class="header">
            <h2>Create account</h2>
            <p>Join Bosa‑Care for better chronic care</p>
        </div>

        <!-- Role Toggle -->
        <div class="role-toggle" id="roleToggle">
            <button class="active" data-role="patient" onclick="setRole('patient')">👤 Patient</button>
            <button data-role="doctor" onclick="setRole('doctor')">👨‍⚕️ Doctor</button>
        </div>

        <!-- Signup Form -->
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" id="firstName" placeholder="John" required />
                </div>
                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" placeholder="Matthews" required />
                </div>
            </div>

            <div class="form-group full-width">
                <label for="emailInput">Email address</label>
                <input type="email" id="emailInput" placeholder="you@example.com" required />
            </div>

            <div class="form-group full-width">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="••••••••" required />
                <div class="password-requirements" id="passwordReqs">
                    <span id="reqLength" class="invalid">✗ At least 8 characters</span> ·
                    <span id="reqUpper" class="invalid">✗ One uppercase</span> ·
                    <span id="reqNumber" class="invalid">✗ One number</span>
                </div>
            </div>

            <div class="form-group full-width" id="doctorFields" style="display:none;">
                <label for="specialty">Specialty</label>
                <select id="specialty">
                    <option value="">Select your specialty</option>
                    <option value="Internal Medicine">Internal Medicine</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Endocrinology">Endocrinology</option>
                    <option value="Oncology">Oncology</option>
                    <option value="Hematology">Hematology</option>
                    <option value="Infectious Disease">Infectious Disease</option>
                    <option value="Family Medicine">Family Medicine</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group full-width" id="patientFields">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob" />
            </div>

            <div class="terms">
                <input type="checkbox" id="termsCheck" required />
                <label for="termsCheck">
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>
            </div>

            <button type="submit" class="signup-btn" id="signupBtn">Create Account</button>
        </form>

        <!-- Status message -->
        <div id="signupStatus"></div>

        <!-- Login link -->
        <div class="login-link">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <div class="footer-note">Bosa‑Care · Chronic care management platform</div>

    <script>
        // ===== STATE =====
        let currentRole = 'patient'; // 'patient' or 'doctor'

        // ===== ROLE TOGGLE =====
        function setRole(role) {
            currentRole = role;
            const btns = document.querySelectorAll('#roleToggle button');
            btns.forEach(b => b.classList.remove('active'));
            document.querySelector(`#roleToggle button[data-role="${role}"]`).classList.add('active');

            // Show/hide role-specific fields
            const doctorFields = document.getElementById('doctorFields');
            const patientFields = document.getElementById('patientFields');

            if (role === 'doctor') {
                doctorFields.style.display = 'block';
                patientFields.style.display = 'none';
            } else {
                doctorFields.style.display = 'none';
                patientFields.style.display = 'block';
            }

            // Clear any previous status
            const status = document.getElementById('signupStatus');
            status.className = '';
            status.style.display = 'none';
            status.textContent = '';
        }

        // ===== PASSWORD VALIDATION =====
        document.getElementById('passwordInput').addEventListener('input', function() {
            const pwd = this.value;

            const len = document.getElementById('reqLength');
            const upper = document.getElementById('reqUpper');
            const num = document.getElementById('reqNumber');

            const hasLength = pwd.length >= 8;
            const hasUpper = /[A-Z]/.test(pwd);
            const hasNumber = /[0-9]/.test(pwd);

            len.className = hasLength ? 'valid' : 'invalid';
            len.textContent = hasLength ? '✓ At least 8 characters' : '✗ At least 8 characters';

            upper.className = hasUpper ? 'valid' : 'invalid';
            upper.textContent = hasUpper ? '✓ One uppercase' : '✗ One uppercase';

            num.className = hasNumber ? 'valid' : 'invalid';
            num.textContent = hasNumber ? '✓ One number' : '✗ One number';
        });

        // ===== HANDLE SIGNUP =====
        function handleSignup(e) {
            e.preventDefault();

            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const terms = document.getElementById('termsCheck').checked;
            const status = document.getElementById('signupStatus');

            // Reset status
            status.className = '';
            status.style.display = 'none';
            status.textContent = '';

            // Validate required fields
            if (!firstName || !lastName || !email || !password) {
                showStatus('Please fill in all required fields.', 'error');
                return;
            }

            if (!terms) {
                showStatus('Please agree to the Terms of Service and Privacy Policy.', 'error');
                return;
            }

            // Validate email format
            if (!email.includes('@') || !email.includes('.')) {
                showStatus('Please enter a valid email address.', 'error');
                return;
            }

            // Validate password strength
            if (password.length < 8 || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
                showStatus('Password must be at least 8 characters with one uppercase and one number.', 'error');
                return;
            }

            // Role-specific validation
            if (currentRole === 'doctor') {
                const specialty = document.getElementById('specialty').value;
                if (!specialty) {
                    showStatus('Please select your medical specialty.', 'error');
                    return;
                }
            }

            if (currentRole === 'patient') {
                const dob = document.getElementById('dob').value;
                if (!dob) {
                    showStatus('Please enter your date of birth.', 'error');
                    return;
                }
            }

            // Simulate account creation
            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account…';

            setTimeout(() => {
                // Store user data in localStorage for demo
                const userData = {
                    firstName,
                    lastName,
                    email,
                    role: currentRole,
                    specialty: currentRole === 'doctor' ? document.getElementById('specialty').value : null,
                    dob: currentRole === 'patient' ? document.getElementById('dob').value : null,
                    createdAt: new Date().toISOString()
                };

                // Store in localStorage (for demo purposes)
                localStorage.setItem('bosaUser', JSON.stringify(userData));
                localStorage.setItem('bosaRole', currentRole);

                showStatus('✅ Account created successfully! Redirecting…', 'success');

                setTimeout(() => {
                    window.location.href = currentRole === 'patient' ? 'profile-patient.html' : 'profile-doctor.html';
                }, 1200);

                btn.disabled = false;
                btn.textContent = 'Create Account';
            }, 1500);
        }

        function showStatus(message, type) {
            const status = document.getElementById('signupStatus');
            status.textContent = message;
            status.className = type;
            status.style.display = 'block';
        }

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            setRole('patient');
        });
    </script>

</body>
</html>
