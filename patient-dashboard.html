<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bosa‑Care · Patient Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f0ff;
            color: #1e1a2b;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 2rem;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(128, 90, 213, 0.12);
            flex-wrap: wrap;
            gap: 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 20px rgba(128, 90, 213, 0.06);
        }
        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #2d1b4e;
        }
        .brand span {
            color: #7c3aed;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.8rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4a3f5e;
        }
        .nav-links a {
            transition: 0.15s;
            padding: 0.3rem 0;
            border-bottom: 2px solid transparent;
        }
        .nav-links a:hover {
            color: #7c3aed;
            border-bottom-color: rgba(124, 58, 237, 0.3);
        }
        .nav-links a.active {
            color: #7c3aed;
            border-bottom-color: #7c3aed;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        .nav-user {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            color: #4a3f5e;
        }
        .nav-user .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(145deg, #7c3aed, #6d28d9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(124, 58, 237, 0.3);
            padding: 0.45rem 1.3rem;
            border-radius: 40px;
            color: #4a3f5e;
            font-weight: 500;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .btn-outline:hover {
            background: rgba(124, 58, 237, 0.06);
            border-color: #7c3aed;
            color: #7c3aed;
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            background: linear-gradient(145deg, #7c3aed, #6d28d9);
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            color: white;
            transition: 0.2s;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.25);
            font-size: 0.85rem;
        }
        .btn-primary:hover {
            background: #6d28d9;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
        }
        .btn-secondary {
            background: rgba(124, 58, 237, 0.06);
            border: 1px solid rgba(124, 58, 237, 0.12);
            padding: 0.55rem 1.2rem;
            border-radius: 40px;
            color: #4a3f5e;
            font-weight: 500;
            transition: 0.15s;
            font-size: 0.85rem;
        }
        .btn-secondary:hover {
            background: rgba(124, 58, 237, 0.1);
            border-color: rgba(124, 58, 237, 0.25);
        }
        .btn-success {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            color: #16a34a;
            font-weight: 600;
            font-size: 0.75rem;
            transition: 0.15s;
        }
        .btn-success:hover {
            background: rgba(34, 197, 94, 0.2);
        }
        .btn-warning {
            background: rgba(234, 179, 8, 0.1);
            border: 1px solid rgba(234, 179, 8, 0.2);
            padding: 0.4rem 1rem;
            border-radius: 30px;
            color: #b45309;
            font-weight: 600;
            font-size: 0.75rem;
            transition: 0.15s;
        }
        .btn-warning:hover {
            background: rgba(234, 179, 8, 0.18);
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
        }

        /* ===== GREETING ===== */
        .greeting {
            margin-bottom: 2rem;
        }
        .greeting h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: #2d1b4e;
        }
        .greeting p {
            color: #6b5f7e;
            font-size: 1rem;
            margin-top: 0.2rem;
        }

        /* ===== STATS ROW ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: #ffffff;
            border: 1px solid rgba(128, 90, 213, 0.08);
            border-radius: 20px;
            padding: 1.2rem 1.5rem;
            box-shadow: 0 4px 16px rgba(128, 90, 213, 0.05);
            transition: 0.2s;
        }
        .stat-card:hover {
            border-color: rgba(128, 90, 213, 0.15);
            box-shadow: 0 8px 24px rgba(128, 90, 213, 0.08);
        }
        .stat-card .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 600;
            color: #7c3aed;
            line-height: 1.1;
        }
        .stat-card .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #6b5f7e;
            margin-top: 0.2rem;
        }

        /* ===== GRID ===== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        /* ===== CARDS ===== */
        .card {
            background: #ffffff;
            border: 1px solid rgba(128, 90, 213, 0.08);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 16px rgba(128, 90, 213, 0.04);
            transition: 0.2s;
        }
        .card:hover {
            border-color: rgba(128, 90, 213, 0.12);
            box-shadow: 0 8px 24px rgba(128, 90, 213, 0.06);
        }
        .card-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #6b5f7e;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .card-title .badge {
            background: rgba(124, 58, 237, 0.08);
            padding: 0.15rem 0.8rem;
            border-radius: 30px;
            font-size: 0.65rem;
            color: #7c3aed;
        }

        /* ===== HEALTH METRICS ===== */
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .metric-item {
            background: #f8f5ff;
            border-radius: 14px;
            padding: 1rem;
            text-align: center;
        }
        .metric-item .value {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 600;
            color: #7c3aed;
        }
        .metric-item .label {
            font-size: 0.7rem;
            color: #6b5f7e;
            margin-top: 0.2rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .metric-item .status {
            font-size: 0.65rem;
            margin-top: 0.3rem;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            display: inline-block;
        }
        .status-good {
            background: rgba(34, 197, 94, 0.1);
            color: #16a34a;
        }
        .status-warning {
            background: rgba(234, 179, 8, 0.1);
            color: #b45309;
        }
        .status-danger {
            background: rgba(239, 68, 68, 0.08);
            color: #dc2626;
        }

        /* ===== APPOINTMENTS LIST ===== */
        .appt-list {
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .appt-list::-webkit-scrollbar {
            width: 3px;
        }
        .appt-list::-webkit-scrollbar-thumb {
            background: #d5c4f0;
            border-radius: 6px;
        }
        .appt-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 0.5rem;
            border-bottom: 1px solid rgba(128, 90, 213, 0.05);
        }
        .appt-item .date {
            font-weight: 600;
            color: #7c3aed;
            font-size: 0.8rem;
            min-width: 80px;
        }
        .appt-item .info {
            flex: 1;
            margin: 0 0.8rem;
        }
        .appt-item .info .type {
            font-weight: 500;
            color: #2d1b4e;
        }
        .appt-item .info .detail {
            font-size: 0.75rem;
            color: #6b5f7e;
        }
        .status-pill {
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-pill.confirmed {
            background: rgba(34, 197, 94, 0.1);
            color: #16a34a;
        }
        .status-pill.pending {
            background: rgba(234, 179, 8, 0.1);
            color: #b45309;
        }
        .status-pill.completed {
            background: rgba(124, 58, 237, 0.08);
            color: #7c3aed;
        }
        .status-pill.cancelled {
            background: rgba(239, 68, 68, 0.08);
            color: #dc2626;
        }

        /* ===== MEDICATION LIST ===== */
        .med-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .med-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 1rem;
            background: #f8f5ff;
            border-radius: 12px;
            border-left: 3px solid #7c3aed;
        }
        .med-item .name {
            font-weight: 500;
            color: #2d1b4e;
        }
        .med-item .dosage {
            font-size: 0.8rem;
            color: #6b5f7e;
        }
        .med-item .schedule {
            font-size: 0.7rem;
            color: #7c3aed;
            background: rgba(124, 58, 237, 0.08);
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
        }

        /* ===== SYMPTOM LOG ===== */
        .symptom-form textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            border: 1.5px solid rgba(128, 90, 213, 0.12);
            background: #f8f5ff;
            color: #2d1b4e;
            font-size: 0.9rem;
            font-family: 'DM Sans', sans-serif;
            resize: vertical;
            min-height: 80px;
            transition: 0.15s;
        }
        .symptom-form textarea:focus {
            outline: none;
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.08);
        }
        .symptom-form textarea::placeholder {
            color: #9a8aaa;
        }
        .symptom-form .actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .symptom-history {
            margin-top: 1rem;
            max-height: 150px;
            overflow-y: auto;
        }
        .symptom-history::-webkit-scrollbar {
            width: 3px;
        }
        .symptom-history::-webkit-scrollbar-thumb {
            background: #d5c4f0;
            border-radius: 6px;
        }
        .symptom-entry {
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(128, 90, 213, 0.05);
            font-size: 0.85rem;
        }
        .symptom-entry .text {
            color: #2d1b4e;
        }
        .symptom-entry .time {
            font-size: 0.7rem;
            color: #9a8aaa;
            float: right;
        }

        /* ===== FULL WIDTH ===== */
        .full-width {
            grid-column: 1 / -1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: 1;
            }
        }
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                padding: 0.8rem 1rem;
            }
            .nav-links {
                justify-content: center;
                flex-wrap: wrap;
                gap: 1rem;
            }
            .nav-right {
                justify-content: center;
                flex-wrap: wrap;
            }
            .container {
                padding: 1rem;
            }
            .stats-row {
                grid-template-columns: 1fr 1fr;
            }
            .metric-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (max-width: 480px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
            .metric-grid {
                grid-template-columns: 1fr;
            }
